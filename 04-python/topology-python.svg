<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Topologia de automação NetOps com Python</title><desc id="desc">Fluxo de um operador para scripts Python, inventário YAML, segredos por variáveis de ambiente, roteadores de laboratório, coleta de dados, validação e relatórios.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/></marker></defs>
<rect width="1200" height="760" rx="24" fill="url(#bg)"/>
<text x="48" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#f8fafc">PYTHON NETOPS — TOPOLOGIA DE REFERÊNCIA</text>
<text x="48" y="88" font-family="Arial,sans-serif" font-size="15" fill="#cbd5e1">Coleta segura • validação • automação auditável • laboratório isolado</text>
<g font-family="Arial,sans-serif">
<rect x="55" y="145" width="210" height="100" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="160" y="180" fill="#f8fafc" font-size="18" text-anchor="middle" font-weight="700">OPERADOR / CI</text><text x="160" y="207" fill="#cbd5e1" font-size="14" text-anchor="middle">CLI • Git • testes</text>
<rect x="335" y="125" width="270" height="140" rx="14" fill="#123047" stroke="#38bdf8" stroke-width="2"/><text x="470" y="160" fill="#e0f2fe" font-size="20" text-anchor="middle" font-weight="700">Python NetOps</text><text x="470" y="190" fill="#bae6fd" font-size="14" text-anchor="middle">Netmiko / NAPALM</text><text x="470" y="215" fill="#bae6fd" font-size="14" text-anchor="middle">PyYAML • validação</text><text x="470" y="240" fill="#bae6fd" font-size="14" text-anchor="middle">timeouts • logs • erros</text>
<rect x="675" y="125" width="220" height="140" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><text x="785" y="160" fill="#f5f3ff" font-size="18" text-anchor="middle" font-weight="700">Dados e segredos</text><text x="785" y="190" fill="#ddd6fe" font-size="14" text-anchor="middle">inventory/lab.yml</text><text x="785" y="215" fill="#ddd6fe" font-size="14" text-anchor="middle">.env fora do Git</text><text x="785" y="240" fill="#ddd6fe" font-size="14" text-anchor="middle">configuração validada</text>
<rect x="965" y="145" width="185" height="100" rx="14" fill="#3f1d2e" stroke="#fb7185" stroke-width="2"/><text x="1057" y="180" fill="#ffe4e6" font-size="17" text-anchor="middle" font-weight="700">LAB DE REDE</text><text x="1057" y="207" fill="#fecdd3" font-size="14" text-anchor="middle">EVE-NG / GNS3</text>
<path d="M265 195 H325" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/><path d="M605 195 H665" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/><path d="M895 195 H955" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="335" y="330" width="270" height="110" rx="14" fill="#163b2c" stroke="#4ade80" stroke-width="2"/><text x="470" y="365" fill="#dcfce7" font-size="18" text-anchor="middle" font-weight="700">Coleta somente leitura</text><text x="470" y="393" fill="#bbf7d0" font-size="14" text-anchor="middle">show version / interfaces</text><text x="470" y="416" fill="#bbf7d0" font-size="14" text-anchor="middle">timeout e tratamento de falhas</text>
<rect x="675" y="330" width="220" height="110" rx="14" fill="#163b2c" stroke="#4ade80" stroke-width="2"/><text x="785" y="365" fill="#dcfce7" font-size="18" text-anchor="middle" font-weight="700">Validação</text><text x="785" y="393" fill="#bbf7d0" font-size="14" text-anchor="middle">pytest • Ruff</text><text x="785" y="416" fill="#bbf7d0" font-size="14" text-anchor="middle">contratos e evidências</text>
<rect x="965" y="330" width="185" height="110" rx="14" fill="#3f3217" stroke="#fbbf24" stroke-width="2"/><text x="1057" y="365" fill="#fef3c7" font-size="18" text-anchor="middle" font-weight="700">Saídas</text><text x="1057" y="393" fill="#fde68a" font-size="14" text-anchor="middle">JSON / CSV</text><text x="1057" y="416" fill="#fde68a" font-size="14" text-anchor="middle">logs sem segredos</text>
<path d="M1057 245 V290 H470 V320" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/><path d="M605 385 H665" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/><path d="M895 385 H955" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="510" width="1095" height="175" rx="14" fill="#111827" stroke="#475569" stroke-width="2"/><text x="85" y="548" fill="#f8fafc" font-size="20" font-weight="700">Guardrails operacionais</text>
<text x="85" y="584" fill="#cbd5e1" font-size="16">1. Começar com comandos de leitura e inventário de laboratório.</text><text x="85" y="614" fill="#cbd5e1" font-size="16">2. Credenciais via ambiente / cofre; nunca colocar senhas no repositório.</text><text x="85" y="644" fill="#cbd5e1" font-size="16">3. Mudanças de configuração exigem diff, aprovação, backup e plano de rollback.</text><text x="85" y="674" fill="#cbd5e1" font-size="16">4. Registrar alvo, horário, resultado e erro — sem tokens ou dados sensíveis.</text>
</g></svg>