[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "altave-python-netops"
version = "0.1.0"
description = "Laboratórios didáticos de automação de redes com Python"
requires-python = ">=3.10"
dependencies = ["netmiko>=4.4,<5", "PyYAML>=6.0,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
