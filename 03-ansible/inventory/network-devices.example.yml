---
# Example only: documentation IP addresses; replace with lab management IPs.
# Do not store credentials in this file.
all:
  children:
    network_devices:
      children:
        cisco_ios:
          hosts:
            r1:
              ansible_host: 192.0.2.11
            r2:
              ansible_host: 192.0.2.12
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        ansible_user: netops
        ansible_become: true
        ansible_become_method: enable
# For a lab run, prompt for passwords instead of saving them:
# ansible-playbook -i inventory/network-devices.example.yml playbooks/precheck-network.yml --ask-pass --ask-become-pass
