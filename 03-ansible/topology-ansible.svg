<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><style>.bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#b7c5d8;stroke-width:2}.title{font:700 30px Arial;fill:#17324d}.h{font:700 22px Arial;fill:#17324d}.t{font:17px Arial;fill:#26384a}.small{font:15px Arial;fill:#455a70}.node{fill:#edf5ff;stroke:#3778b8;stroke-width:2}.router{fill:#e6f6ef;stroke:#24845d;stroke-width:2}.warn{fill:#fff4df;stroke:#c78a22;stroke-width:2}.line{stroke:#627d98;stroke-width:3;fill:none}.dash{stroke:#7b61a8;stroke-width:3;stroke-dasharray:9 7;fill:none}</style></defs><rect class="bg" width="1500" height="900" rx="20"/><text x="55" y="55" class="title">ALTAVE | Ansible Network Automation Lab</text><text x="55" y="88" class="small">Logical topology • illustrative addresses • validate in EVE-NG / PNETLab before use</text><rect x="45" y="120" width="1410" height="715" rx="18" class="panel"/><rect x="75" y="155" width="340" height="570" rx="15" fill="#f1f7ff" stroke="#9bbce2" stroke-width="2"/><text x="100" y="195" class="h">Automation / Control</text><rect x="105" y="225" width="280" height="105" rx="12" class="node"/><text x="125" y="260" class="h">Linux NetOps</text><text x="125" y="289" class="t">Ansible • Python • Git</text><text x="125" y="312" class="small">SSH / API • secrets protected</text><rect x="105" y="360" width="280" height="100" rx="12" class="node"/><text x="125" y="395" class="h">Inventory &amp; Variables</text><text x="125" y="425" class="t">Groups • host_vars • vault</text><rect x="105" y="490" width="280" height="100" rx="12" class="node"/><text x="125" y="525" class="h">Playbooks / Roles</text><text x="125" y="555" class="t">Pre-check • facts • backup</text><rect x="105" y="620" width="280" height="75" rx="12" class="warn"/><text x="125" y="650" class="h">CI / Review</text><text x="125" y="678" class="t">Lint • diff • approval</text><path d="M245 330 V360 M245 460 V490 M245 590 V620" class="line"/><rect x="475" y="155" width="925" height="570" rx="15" fill="#fbfcfe" stroke="#aebdcd" stroke-width="2"/><text x="505" y="195" class="h">Network Lab / Managed Devices</text><rect x="520" y="245" width="220" height="110" rx="12" class="router"/><text x="545" y="280" class="h">R1 • Cisco IOS</text><text x="545" y="310" class="t">Edge / Site A</text><text x="545" y="335" class="small">Example: 192.0.2.11</text><rect x="835" y="245" width="220" height="110" rx="12" class="router"/><text x="860" y="280" class="h">R2 • Cisco IOS</text><text x="860" y="310" class="t">Edge / Site B</text><text x="860" y="335" class="small">Example: 192.0.2.12</text><path d="M740 300 H835" class="line"/><text x="755" y="285" class="small">WAN / routing</text><rect x="520" y="430" width="220" height="100" rx="12" class="node"/><text x="545" y="465" class="h">SW1</text><text x="545" y="495" class="t">VLANs / access ports</text><rect x="835" y="430" width="220" height="100" rx="12" class="node"/><text x="860" y="465" class="h">SW2</text><text x="860" y="495" class="t">VLANs / trunks</text><path d="M630 355 V430 M945 355 V430" class="line"/><rect x="1130" y="245" width="225" height="110" rx="12" class="warn"/><text x="1150" y="280" class="h">Linux Host</text><text x="1150" y="310" class="t">SSH reachability</text><text x="1150" y="335" class="small">Ping / TCP 22 checks</text><path d="M1055 300 H1130" class="line"/><rect x="1130" y="430" width="225" height="100" rx="12" class="node"/><text x="1150" y="465" class="h">Telemetry</text><text x="1150" y="495" class="t">Logs • metrics • evidence</text><path d="M1055 480 H1130" class="line"/><path d="M385 278 C430 278 430 300 520 300" class="dash"/><path d="M385 400 C445 400 445 480 520 480" class="dash"/><text x="500" y="585" class="h">Automation lifecycle</text><rect x="520" y="610" width="180" height="65" rx="10" class="node"/><text x="540" y="650" class="t">1. Inventory</text><rect x="730" y="610" width="180" height="65" rx="10" class="node"/><text x="750" y="650" class="t">2. Pre-check</text><rect x="940" y="610" width="180" height="65" rx="10" class="node"/><text x="960" y="650" class="t">3. Backup / diff</text><rect x="1150" y="610" width="205" height="65" rx="10" class="warn"/><text x="1170" y="650" class="t">4. Approval</text><path d="M700 642 H730 M910 642 H940 M1120 642 H1150" class="line"/><text x="80" y="785" class="small">Safety: start with read-only checks; no production changes without peer review, backup, change window and rollback plan.</text></svg>