<rect x="780" y="680" width="675" height="180" rx="20" fill="#172337" stroke="#475569" stroke-width="2"/><text x="810" y="720" class="t">VALIDAÇÃO E OBSERVABILIDADE</text><text x="815" y="758" class="b">• Reachability: ping, traceroute, TCP/UDP e caminho de retorno</text><text x="815" y="787" class="b">• Routing: vizinhos OSPF, LSDB, rotas e convergência</text><text x="815" y="816" class="b">• Switching: VLAN, trunk, MAC, STP, erros e drops</text><text x="815" y="845" class="b">• QoS/SRE: perda, RTT, jitter, uso, disponibilidade e alertas</text><text x="55" y="895" class="s">Topologia de estudo. Endereçamento, VLANs, comandos e recursos variam conforme as imagens do PNETLab.</text>
